name: Deploy Personal Pro 360

on:
  push:
    branches:
      - deploy-personal-pro-360
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          TOKEN="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=personal-pro-360-deploy" | jq -r .value)"
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Get one-time Netlify authorization
        id: netlify
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          PROXY="$(curl -fsSL -X POST -H "Authorization: Bearer $OIDC_TOKEN" https://hrdwitayhgogzdmovsfd.supabase.co/functions/v1/netlify-deploy-bridge | jq -r .proxy)"
          test -n "$PROXY"
          test "$PROXY" != "null"
          echo "::add-mask::$PROXY"
          echo "proxy=$PROXY" >> "$GITHUB_OUTPUT"

      - name: Rebuild static package
        shell: bash
        run: |
          rm -rf deploy360/site deploy360/site.b64 deploy360/site.zip
          mkdir -p deploy360/site
          cat deploy360/chunk*.b64 > deploy360/site.b64
          base64 -d deploy360/site.b64 > deploy360/site.zip
          unzip -q deploy360/site.zip -d deploy360/site
          test -f deploy360/site/index.html
          test -f deploy360/site/config.js
          test -f deploy360/site/assets/app.js
          test -f deploy360/site/assets/app.css
          grep -q "hrdwitayhgogzdmovsfd.supabase.co" deploy360/site/config.js
          grep -q "personal-pro-manager360.netlify.app" deploy360/site/config.js

      - name: Deploy production to Netlify
        working-directory: deploy360/site
        env:
          NETLIFY_PROXY: ${{ steps.netlify.outputs.proxy }}
        shell: bash
        run: |
          npx -y @netlify/mcp@latest --site-id 99fbcec4-ad81-49dc-8c42-eac5c013b81d --proxy-path "$NETLIFY_PROXY"
